<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Savoria | Menu manager</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap');
:root{--navy:#112235;--cream:#fbf8f1;--orange:#e8713c;--line:#e7e5df;--muted:#66717b;--red:#bd4040}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--navy);font:15px 'DM Sans',Arial,sans-serif}a{text-decoration:none;color:inherit}.nav{height:76px;display:flex;align-items:center;justify-content:space-between;width:min(1120px,calc(100% - 40px));margin:auto}.brand{font:700 27px 'Playfair Display',serif}.brand i{color:var(--orange);font-style:normal}.back{color:var(--muted);font-weight:600}.back:hover{color:var(--navy)}main{width:min(1120px,calc(100% - 40px));margin:42px auto 70px}.eyebrow{color:var(--orange);font-size:12px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase}h1{margin:8px 0 4px;font:700 clamp(2.3rem,4vw,3.4rem) 'Playfair Display',serif}header p{margin:0;color:var(--muted);font-size:16px}.layout{display:grid;grid-template-columns:355px 1fr;gap:25px;margin-top:35px;align-items:start}.card{padding:25px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 24px #22354b0a}h2{margin:0 0 21px;font-size:17px}label{display:block;margin:16px 0 7px;font-weight:700}input{width:100%;padding:11px 12px;border:1px solid #d5d9da;border-radius:7px;font:inherit}input:focus{border-color:var(--orange);outline:3px solid #e8713c20}.check{display:flex;gap:9px;align-items:center;font-weight:500}.check input{width:auto}.actions{display:flex;gap:9px;margin-top:22px}button{border:0;border-radius:7px;padding:11px 14px;background:#edf0f2;color:var(--navy);font:700 14px inherit;cursor:pointer}.primary{flex:1;background:var(--navy);color:#fff}.danger{color:var(--red);background:#fff1f1}.menu-head{display:flex;align-items:center;justify-content:space-between}.menu-head span{color:var(--muted);font-size:13px}.list{list-style:none;padding:0;margin:0}.list li{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:17px 0;border-top:1px solid var(--line)}.details{display:grid;gap:5px}.details strong{font-size:16px}.details small{color:var(--muted)}.badge{display:inline-block;padding:2px 8px;border-radius:12px;background:#e9f6ed;color:#287043;font-size:11px;font-weight:700}.off{background:#f8eee7;color:#96611c}.row-actions{display:flex;gap:8px}.empty{display:block!important;text-align:center;padding:35px!important;color:var(--muted)}#message{min-height:22px;margin:15px 0 0;font-weight:600}.success{color:#287043}.error{color:var(--red)}@media(max-width:760px){.layout{grid-template-columns:1fr}.nav{height:65px}main{margin-top:25px}.list li{align-items:flex-start}.row-actions{flex-direction:column}}
</style></head><body>
<nav class="nav"><a class="brand" href="/">Savor<i>ia</i></a><a class="back" href="/">← Back to home</a></nav><main><header><div class="eyebrow">Restaurant workspace</div><h1>Menu manager</h1><p>Keep your guests' menu current, clear, and ready to order.</p></header><div class="layout"><section class="card"><h2 id="form-title">Add a menu item</h2><form id="food-form"><label for="foodname">Item name</label><input id="foodname" name="foodname" placeholder="e.g. Garden Pasta" maxlength="100" required><label for="price">Price (₹)</label><input id="price" name="price" type="number" min="0" step="0.01" placeholder="0.00" required><label class="check"><input id="available" name="available" type="checkbox" checked>Available to order</label><div class="actions"><button class="primary" id="submit" type="submit">Save item</button><button id="cancel" type="button" hidden>Cancel</button></div></form><p id="message" role="status" aria-live="polite"></p></section><section class="card"><div class="menu-head"><h2>Current menu</h2><span id="count"></span></div><ul id="food-list" class="list"></ul></section></div></main>
<script>
const form=document.querySelector('#food-form'),list=document.querySelector('#food-list'),message=document.querySelector('#message'),submit=document.querySelector('#submit'),cancel=document.querySelector('#cancel'),title=document.querySelector('#form-title'),count=document.querySelector('#count');let editingId=null;const tell=(text,type='')=>{message.textContent=text;message.className=type},reset=()=>{editingId=null;form.reset();form.available.checked=true;title.textContent='Add a menu item';submit.textContent='Save item';cancel.hidden=true};
async function api(url,options){const r=await fetch(url,options);if(!r.ok){let msg='We could not complete that request. Please try again.';try{msg=(await r.json()).message||msg}catch(_){}throw Error(msg)}return r.status===204?null:r.json()}
function edit(f){editingId=f.id;form.foodname.value=f.foodname;form.price.value=f.price;form.available.checked=f.available;title.textContent='Update menu item';submit.textContent='Update item';cancel.hidden=false;form.foodname.focus();scrollTo({top:0,behavior:'smooth'})}
function draw(foods){list.replaceChildren();count.textContent=`${foods.length} item${foods.length===1?'':'s'}`;if(!foods.length){list.innerHTML='<li class="empty">Your menu is waiting for its first item.</li>';return}foods.forEach(f=>{const li=document.createElement('li'),d=document.createElement('div'),a=document.createElement('div');d.className='details';a.className='row-actions';const name=document.createElement('strong'),meta=document.createElement('small'),badge=document.createElement('span');name.textContent=f.foodname;badge.className=`badge ${f.available?'':'off'}`;badge.textContent=f.available?'Available':'Unavailable';meta.textContent=`₹${Number(f.price).toFixed(2)} · `;meta.append(badge);d.append(name,meta);a.innerHTML='<button type="button">Edit</button><button class="danger" type="button">Delete</button>';a.children[0].onclick=()=>edit(f);a.children[1].onclick=()=>remove(f);li.append(d,a);list.append(li)})}
async function load(){try{draw(await api('/api/order/foods'))}catch(e){list.innerHTML='<li class="empty">Unable to load your menu.</li>';tell(e.message,'error')}}async function remove(f){if(!confirm(`Delete ${f.foodname}?`))return;try{await api(`/api/order/foods/${f.id}`,{method:'DELETE'});tell(`${f.foodname} was deleted.`,'success');load()}catch(e){tell(e.message,'error')}}form.onsubmit=async e=>{e.preventDefault();const food={foodname:form.foodname.value.trim(),price:Number(form.price.value),available:form.available.checked};if(!food.foodname||food.price<0)return tell('Enter a valid item name and price.','error');try{const update=editingId!==null;await api(update?`/api/order/foods/${editingId}`:'/api/order/addFood',{method:update?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(food)});tell(`Menu item ${update?'updated':'saved'} successfully.`,'success');reset();load()}catch(e){tell(e.message,'error')}};cancel.onclick=reset;load();
</script></body></html>
