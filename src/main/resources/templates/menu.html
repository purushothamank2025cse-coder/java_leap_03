<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Savoria | View menu</title>
  <style>
    :root{--navy:#112235;--cream:#fbf8f1;--orange:#e8713c;--line:#e7e5df;--muted:#66717b;--red:#bd4040}
    *{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--navy);font:15px Arial,sans-serif}
    a{text-decoration:none;color:inherit}.nav,main{width:min(1060px,calc(100% - 40px));margin:auto}.nav{height:76px;display:flex;align-items:center;justify-content:space-between}.brand{font:700 27px Georgia,serif}.brand i{color:var(--orange);font-style:normal}.nav-links{display:flex;gap:20px;color:var(--muted);font-weight:700}.nav-links a:hover{color:var(--navy)}
    main{margin-top:40px;margin-bottom:70px}.eyebrow{color:var(--orange);font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase}h1{margin:8px 0;color:var(--navy);font:700 48px Georgia,serif}header p{color:var(--muted);font-size:17px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:15px;margin:30px 0 15px}.count{color:var(--muted)}.button{display:inline-block;padding:12px 16px;border:0;border-radius:7px;background:var(--navy);color:#fff;font-weight:700}.button:hover{background:#1e3a57}.list{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;padding:0;list-style:none}.item{padding:22px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px #22354b0a}.item h2{margin:0 0 12px;font-size:20px}.price{font-size:18px;font-weight:700}.badge{display:inline-block;margin-top:14px;padding:4px 9px;border-radius:12px;background:#e9f6ed;color:#287043;font-size:12px;font-weight:700}.off{background:#f8eee7;color:#96611c}.item-actions{display:flex;gap:8px;margin-top:18px}.item-actions a,.item-actions button{padding:9px 12px;border:1px solid #d8dfe5;border-radius:6px;background:#fff;color:var(--navy);font-weight:700;cursor:pointer}.item-actions .delete{border-color:#efd0cb;background:#fff7f6;color:var(--red)}.empty{text-align:center;padding:40px;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:12px}
    @media(max-width:650px){.nav{height:auto;padding:18px 0;align-items:flex-start;gap:16px;flex-direction:column}.nav-links{flex-wrap:wrap}h1{font-size:38px}}
  </style>
</head>
<body>
  <nav class="nav"><a class="brand" href="/">Savor<i>ia</i></a><div class="nav-links"><a href="/">Home</a><a href="/add-food">Add item</a><a href="/menu">Manager</a></div></nav>
  <main>
    <header><div class="eyebrow">Savoria collection</div><h1>View all menu items</h1><p>Browse every dish, check availability, or open an item to update it.</p></header>
    <div class="toolbar"><strong id="count">Loading menu...</strong><a class="button" href="/add-food">+ Add menu item</a></div>
    <ul id="food-list" class="list"></ul>
  </main>
  <script>
    const list=document.getElementById('food-list'),count=document.getElementById('count');
    async function load(){try{const response=await fetch('/api/order/foods');if(!response.ok)throw Error();const foods=await response.json();count.textContent=`${foods.length} ${foods.length===1?'item':'items'}`;list.replaceChildren();if(!foods.length){list.innerHTML='<li class="empty">No menu items yet. Add your first dish.</li>';return}foods.forEach(food=>{const item=document.createElement('li');item.className='item';item.innerHTML=`<h2></h2><div class="price"></div><span class="badge"></span><div class="item-actions"><a href="/edit-food/${food.id}">Edit</a><button class="delete" type="button">Delete</button></div>`;item.querySelector('h2').textContent=food.foodname;item.querySelector('.price').textContent=`₹${Number(food.price).toFixed(2)}`;const badge=item.querySelector('.badge');badge.textContent=food.available?'Available to order':'Unavailable';if(!food.available)badge.classList.add('off');item.querySelector('.delete').onclick=()=>remove(food);list.append(item)})}catch{count.textContent='Unable to load menu';list.innerHTML='<li class="empty">The menu could not be loaded. Please refresh the page.</li>'}}
    async function remove(food){if(!confirm(`Delete ${food.foodname}?`))return;const response=await fetch(`/api/order/foods/${food.id}`,{method:'DELETE'});if(!response.ok){alert('Unable to delete this item.');return}load()}
    load();
  </script>
</body>
</html>
