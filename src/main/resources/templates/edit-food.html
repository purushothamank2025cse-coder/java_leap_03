<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Savoria | Edit item</title>
  <style>
    :root{--navy:#112235;--cream:#fbf8f1;--orange:#e8713c;--line:#e7e5df;--muted:#66717b;--red:#bd4040}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--navy);font:15px Arial,sans-serif}a{text-decoration:none;color:inherit}.nav,main{width:min(760px,calc(100% - 40px));margin:auto}.nav{height:76px;display:flex;align-items:center;justify-content:space-between}.brand{font:700 27px Georgia,serif}.brand i{color:var(--orange);font-style:normal}.back{color:var(--muted);font-weight:700}main{margin-top:45px}.card{padding:30px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 24px #22354b0a}.eyebrow{color:var(--orange);font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase}h1{margin:8px 0 10px;font:700 42px Georgia,serif}p{color:var(--muted);line-height:1.5}label{display:block;margin:20px 0 7px;font-weight:700}input{width:100%;padding:12px;border:1px solid #d5d9da;border-radius:7px;font:inherit}.check{display:flex;align-items:center;gap:9px}.check input{width:auto}.actions{display:flex;gap:10px;margin-top:25px}button,.button{padding:12px 16px;border:0;border-radius:7px;font-weight:700;cursor:pointer}.primary{background:var(--navy);color:#fff}.secondary{background:#edf0f2;color:var(--navy)}#message{min-height:22px;font-weight:700}.success{color:#287043}.error{color:#bd4040}
  </style>
</head>
<body>
  <nav class="nav"><a class="brand" href="/">Savor<i>ia</i></a><a class="back" href="/view-menu">← View menu</a></nav>
  <main><section class="card"><div class="eyebrow">Menu workspace</div><h1>Update menu item</h1><p id="loading">Loading item details...</p><form id="food-form" hidden><label for="foodname">Item name</label><input id="foodname" maxlength="100" required><label for="price">Price (₹)</label><input id="price" type="number" min="0" step="0.01" required><label class="check"><input id="available" type="checkbox">Available to order</label><div class="actions"><button class="primary" type="submit">Save changes</button><a class="button secondary" href="/view-menu">Cancel</a></div><p id="message" role="status"></p></form></section></main>
  <script>
    const id=location.pathname.split('/').pop(),form=document.getElementById('food-form'),loading=document.getElementById('loading'),message=document.getElementById('message');async function load(){const response=await fetch(`/api/order/foods/${id}`);if(!response.ok){loading.textContent='This menu item was not found.';return}const food=await response.json();form.foodname.value=food.foodname;form.price.value=food.price;form.available.checked=food.available;loading.hidden=true;form.hidden=false}form.onsubmit=async event=>{event.preventDefault();const food={foodname:form.foodname.value.trim(),price:Number(form.price.value),available:form.available.checked};if(!food.foodname||food.price<0){message.textContent='Enter a valid item name and price.';message.className='error';return}const response=await fetch(`/api/order/foods/${id}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(food)});if(!response.ok){message.textContent='Unable to update the item.';message.className='error';return}window.location.href='/view-menu'};load();
  </script>
</body>
</html>
